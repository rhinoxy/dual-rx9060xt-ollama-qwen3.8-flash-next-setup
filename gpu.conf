[Unit]
# Ensure Ollama starts only after desktop, graphics drivers, and system services are fully ready
# This prevents GPU discovery watchdog timeouts during boot I/O spikes
After=graphical.target multi-user.target
Wants=graphical.target

[Service]
# Enable Vulkan backend for RDNA 4 (RX 9060 XT / gfx1201)
# RADV driver (Mesa) provides rock-solid stability and supports 24k-32k long context
# without ROCm 7.2 HIP attention kernel crashes ("illegal memory access")
Environment="OLLAMA_VULKAN=1"
Environment="OLLAMA_LLM_LIBRARY=vulkan"

# Spread model layers across both GPUs evenly
Environment="OLLAMA_SCHED_SPREAD=1"

# Limit loaded models to 1 to prevent VRAM fragmentation
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Extend model loading timeout for large models
Environment="OLLAMA_LOAD_TIMEOUT=30m"

# Prevent boot-time GPU discovery watchdog timeout by delaying start until GPU drivers are fully awake
ExecStartPre=/bin/sleep 15

