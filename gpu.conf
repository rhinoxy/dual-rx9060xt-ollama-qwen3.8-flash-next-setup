[Service]
# Force system-installed ROCm 7.2.4 over Ollama's bundled older libraries
# Ollama natively supports gfx1201 (RDNA 4 / RX 9060 XT)
Environment="LD_LIBRARY_PATH=/opt/rocm/lib:/opt/amdgpu/lib/x86_64-linux-gnu"

# Disable SDMA to prevent illegal memory access across dual-socket Xeon PCIe topology
Environment="HSA_ENABLE_SDMA=0"

# Disable Flash Attention to prevent MES hardware scheduler hangs and GPU resets on RDNA 4
Environment="OLLAMA_FLASH_ATTENTION=0"

# Spread model layers across both GPUs evenly
Environment="OLLAMA_SCHED_SPREAD=1"

# Limit loaded models to 1 to prevent VRAM fragmentation and accidental CPU fallback
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Reserve 2GB of VRAM on GPU 0 to protect display output and graph compute buffers
Environment="OLLAMA_GPU_OVERHEAD=2147483648"

# Extend model loading timeout for large (100GB+) models
Environment="OLLAMA_LOAD_TIMEOUT=30m"
